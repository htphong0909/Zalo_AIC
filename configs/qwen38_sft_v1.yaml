name: qwen38_sft_v1
base_model: empero-ai/Qwen3.8-4B-Distill
train_file: data/sft/qwen38_train_sft_v1.jsonl.gz
output_dir: experiments/exp_qwen38_sft_v1
seed: 42
enable_thinking: false
prompt_style: qwen35

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 2.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 20
  max_length: 16384
  use_kernels: true
  use_liger_kernel: true
  logging_steps: 5
  save_steps: 50
  hf_interval_min: 8.0
