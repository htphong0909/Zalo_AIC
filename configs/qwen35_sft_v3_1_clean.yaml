name: qwen35_sft_v3_1_clean
base_model: Qwen/Qwen3.5-4B
train_file: data/sft/qwen35_train_sft_v3_1_clean.jsonl.gz
output_dir: experiments/exp_qwen35_sft_v3_1_clean
seed: 42
enable_thinking: true
prompt_style: qwen35

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 1.5
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 4.5e-5
  weight_decay: 0.02
  lr_scheduler_type: cosine
  warmup_ratio: 0.06
  max_length: 16384
  max_grad_norm: 1.0
  gradient_checkpointing: true
  length_grouped_windows: true
  length_window_batches: 16
  dataloader_num_workers: 4
  dataset_num_proc: 4
  optim: adamw_torch_fused
  use_kernels: true
  use_liger_kernel: true
  push_merged: true
  logging_steps: 5
  save_steps: 35
  hf_interval_min: 8.0
