name: qwen35_v2r_general_lora
base_model: /content/models/qwen35_sft_v2_merged
train_file: data/sft/qwen35_train_v2r_general.jsonl.gz
output_dir: /content/experiments/exp_qwen35_v2r_general_lora
seed: 42
enable_thinking: false
prompt_style: qwen35

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 1.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-5
  weight_decay: 0.02
  lr_scheduler_type: cosine
  warmup_ratio: 0.08
  max_length: 12288
  gradient_checkpointing: true
  length_grouped_windows: true
  use_kernels: false
  use_liger_kernel: true
  push_merged: false
  logging_steps: 5
  save_steps: 20
  hf_interval_min: 5.0
