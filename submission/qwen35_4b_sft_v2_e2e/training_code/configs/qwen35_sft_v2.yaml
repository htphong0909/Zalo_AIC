name: qwen35_sft_v2
base_model: Qwen/Qwen3.5-4B
train_file: data/sft/qwen35_train_sft_v2.jsonl.gz
output_dir: experiments/exp_qwen35_sft_v2
seed: 42
enable_thinking: false
prompt_style: qwen35

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 1.5
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_length: 16384
  use_kernels: true
  use_liger_kernel: true
  logging_steps: 5
  save_steps: 50
  hf_interval_min: 8.0
